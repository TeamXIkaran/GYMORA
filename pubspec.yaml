name: karan_fitness
description: "GYMO - Gym Management & Fitness App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # CORE
  # ============================================================

  cupertino_icons: ^1.0.8

  # ============================================================
  # STATE MANAGEMENT
  # ============================================================

  provider: ^6.1.5+1

  # ============================================================
  # API / NETWORKING
  # ============================================================

  dio: ^5.9.0
  http: ^1.5.0

  # ============================================================
  # NAVIGATION
  # ============================================================

  go_router: ^16.2.0

  # ============================================================
  # LOCAL STORAGE / AUTH
  # ============================================================

  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # ============================================================
  # ENVIRONMENT VARIABLES
  # ============================================================

  flutter_dotenv: ^5.2.1

  # ============================================================
  # JSON / MODELS
  # ============================================================

  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # ============================================================
  # DATE / TIME
  # ============================================================

  intl: ^0.20.2

  # ============================================================
  # IMAGES / FILES
  # ============================================================

  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  file_picker: ^10.3.3

  # ============================================================
  # PERMISSIONS / CONNECTIVITY
  # ============================================================

  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5

  # ============================================================
  # FIREBASE
  # ============================================================

  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1

  # ============================================================
  # LOCAL NOTIFICATIONS
  # ============================================================

  flutter_local_notifications: ^19.4.1

  # ============================================================
  # UI / DESIGN
  # ============================================================

  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  # ============================================================
  # CHARTS / ANALYTICS
  # ============================================================

  fl_chart: ^1.1.1

  # ============================================================
  # CALENDAR
  # ============================================================

  table_calendar: ^3.2.0

  # ============================================================
  # VIDEO / WORKOUT VIDEOS
  # ============================================================

  video_player: ^2.10.0
  chewie: ^1.12.1

  # ============================================================
  # QR CODE
  # ============================================================

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # ============================================================
  # UTILITIES
  # ============================================================

  logger: ^2.6.1
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ============================================================
  # LINTING
  # ============================================================

  flutter_lints: ^6.0.0

  # ============================================================
  # CODE GENERATION
  # ============================================================

  build_runner: ^2.7.1
  json_serializable: ^6.11.0
  freezed: ^3.2.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ==============================================================
# FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

  # ============================================================
  # ASSETS
  # ============================================================
  # Add asset directories only when they actually exist in the project.
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/videos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/karan gym logo.jpg"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/karan gym logo.jpg"
  adaptive_icon_foreground_inset: 24

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/karan gym logo.jpg
  color_dark: "#FFFFFF"
  image_dark: assets/images/karan gym logo.jpg
  android: true
  ios: true
  android_gravity: center
  fullscreen: true
